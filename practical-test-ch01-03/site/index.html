<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduHub Web - Sự kiện sắp diễn ra</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="logo">EduHub Web</div>
    <nav class="site-nav" aria-label="Điều hướng">
      <a href="#">Trang chủ</a>
      <a href="#">Sự kiện</a>
      <a href="#">Đăng ký</a>
    </nav>
  </header>
  
  <main class="site-main">
    <h1>Sự kiện sắp diễn ra</h1>
    <form id="search-form">
      <label for="keyword">Tìm sự kiện...</label>
      <input 
        type="search" 
        id="keyword" 
        name="keyword" 
        placeholder="Tìm sự kiện..."
        autocomplete="off"
      >
      <button type="submit">Tìm</button>
    </form>

    <p id="status" aria-live="polite"></p>

    <div id="event-list">
      <article class="event-card">
        <img src="img/event.svg" alt="Workshop Git &amp; GitHub cho tân sinh viên">
        <h3 class="event-title">
          <a href="event-detail.html?id=22222222-2222-4222-8222-000000000001">Workshop Git &amp; GitHub cho tân sinh viên</a>
        </h3>
        <p class="event-time">
          <time datetime="2026-09-12T01:00:00.000Z">08:00, 12/09/2026</time>
        </p>
        <p class="event-location">Phòng máy A3.201</p>
        <p class="event-seats">Còn 12/40 chỗ</p>
      </article>

      <article class="event-card">
        <img src="img/event.svg" alt="Hackathon EduHub 24 giờ">
        <h3 class="event-title">
          <a href="event-detail.html?id=22222222-2222-4222-8222-000000000004">Hackathon EduHub 24 giờ</a>
        </h3>
        <p class="event-time">
          <time datetime="2026-12-19T01:00:00.000Z">08:00, 19/12/2026</time>
        </p>
        <p class="event-location">Phòng máy A3.205</p>
        <p class="event-seats"><span class="badge">Hết chỗ</span></p>
      </article>
    </div>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 EduHub Web</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
